name: Ludoya API check

# Detect changes in Ludoya's public API before the events page breaks.
# Runs every Monday morning and on demand. A failing run means Ludoya
# changed something: see docs/ludoya-api-reference.md.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The check is a dependency-free script; nothing to cache.
          package-manager-cache: false
      - name: Check Ludoya endpoints and response shapes
        run: node scripts/ludoya/check.mjs
        env:
          LUDOYA_GROUP_ID: ${{ vars.LUDOYA_GROUP_ID }}
          LUDOYA_GROUP_USERNAME: ${{ vars.LUDOYA_GROUP_USERNAME }}
          LUDOYA_GROUP_SEARCH_QUERY: ${{ vars.LUDOYA_GROUP_SEARCH_QUERY }}

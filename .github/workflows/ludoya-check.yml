name: Ludoya API check

# Detect changes in Ludoya's public API (v1) before the site breaks.
# Runs every Monday morning and on demand. A failing run means Ludoya
# changed something or the key was revoked: see docs/ludoya-api-reference.md.
# Needs the LUDOYA_API_KEY repository secret.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The check is a dependency-free script; nothing to cache.
          package-manager-cache: false
      - name: Check Ludoya endpoints and response shapes
        run: node scripts/ludoya/check.mjs
        env:
          LUDOYA_API_KEY: ${{ secrets.LUDOYA_API_KEY }}
